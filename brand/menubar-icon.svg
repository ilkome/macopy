<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <title>MaCopy — menu bar template mark</title>
  <!-- stack of 3 portrait cards, receding up-left like the logo; back cards tuck under the next -->
  <!-- back card -->
  <path d="M21 6 L21 5 Q21 3 19 3 L7 3 Q5 3 5 5 L5 21 Q5 23 7 23 L8 23"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- middle card -->
  <path d="M24 9 L24 8 Q24 6 22 6 L10 6 Q8 6 8 8 L8 24 Q8 26 10 26 L11 26"
        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- front card -->
  <rect x="11" y="9" width="16" height="20" rx="2"
        stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
